name: Check flight deals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Also send the latest deal from each feed (format test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-feeds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check feeds
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          TEST_LATEST: ${{ inputs.test_push && '1' || '0' }}
        run: python check_feeds.py

      - name: Save seen items
        run: |
          git config user.name "flight-deal-bot"
          git config user.email "flight-deal-bot@users.noreply.github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen items"
            git push
          fi
